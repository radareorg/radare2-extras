[package]
name = "r2forwiroh"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0-only"

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
forwiroh = { git = "https://github.com/trufae/forwiroh", rev = "ba1f5e8460747104e43620673e29e47f98171f60" }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"

